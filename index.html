<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fresh N Local Co.</title>
    
    <meta name="theme-color" content="#15803d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fresh N Local" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    
    <script>
      (function() {
        try {
          var faviconUrl = localStorage.getItem('fnl_favicon_url');
          var manifestUrl = '/manifest.json';
          if (faviconUrl) {
            manifestUrl += '?icon=' + encodeURIComponent(faviconUrl);
            
            // Inject dynamic apple touch icon if custom favicon exists
            var appleLink = document.createElement('link');
            appleLink.rel = 'apple-touch-icon';
            appleLink.href = faviconUrl;
            document.head.appendChild(appleLink);
            
            // Inject dynamic favicon
            var iconLink = document.createElement('link');
            iconLink.rel = 'icon';
            iconLink.href = faviconUrl;
            document.head.appendChild(iconLink);
          }
          
          var manifestLink = document.createElement('link');
          manifestLink.rel = 'manifest';
          manifestLink.href = manifestUrl;
          document.head.appendChild(manifestLink);
        } catch (e) {
          console.error(e);
          var defaultManifest = document.createElement('link');
          defaultManifest.rel = 'manifest';
          defaultManifest.href = '/manifest.json';
          document.head.appendChild(defaultManifest);
        }
      })();
    </script>
    <link rel="canonical" href="https://www.freshnlocal.co/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.error('Service worker registration failed', err);
          });
        });
      }
    </script>
  </body>
</html>
