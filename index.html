<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fresh N Local Co.</title>
    
    <meta name="theme-color" content="#15803d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fresh N Local" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    
    <script>
      (function() {
        try {
          var faviconUrl = localStorage.getItem('fnl_favicon_url');
          if (faviconUrl) {
            // Only update the browser tab favicon if custom branding exists
            var iconLink = document.querySelector("link[rel='icon']");
            if (iconLink) {
              iconLink.href = faviconUrl;
            }
          }
        } catch (e) {
          console.error(e);
        }
      })();
    </script>
    <link rel="canonical" href="https://www.freshnlocal.co/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.error('Service worker registration failed', err);
          });
        });
      }
    </script>
  </body>
</html>
