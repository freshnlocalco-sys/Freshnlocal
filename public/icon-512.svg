<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <path id="topCurve" d="M 75,250 A 175,175 0 0,1 425,250" fill="none" />
    <path id="bottomCurve" d="M 425,250 A 175,175 0 0,1 75,250" fill="none" />
  </defs>
  <!-- Background Circle -->
  <circle cx="250" cy="250" r="240" fill="#ffffff" stroke="#84cc16" stroke-width="10"/>
  <circle cx="250" cy="250" r="226" fill="#ffffff" stroke="#15803d" stroke-width="16"/>
  
  <!-- Outer Arch Text -->
  <text font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#15803d" letter-spacing="4">
    <textPath href="#topCurve" startOffset="50%" text-anchor="middle">
      GROWING FOOD FOR SOULS
    </textPath>
  </text>
  <text font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#15803d" letter-spacing="5">
    <textPath href="#bottomCurve" startOffset="50%" text-anchor="middle">
      PURE BIOTIC FARM
    </textPath>
  </text>

  <!-- Inner Foliage / Leaves Ring Top -->
  <g transform="translate(250, 160)">
    <!-- Center leaf -->
    <path d="M0,-55 C20,-30 20,-10 0,0 C-20,-10 -20,-30 0,-55 Z" fill="#84cc16" stroke="#15803d" stroke-width="3"/>
    <path d="M0,-55 L0,0" stroke="#15803d" stroke-width="3"/>
    <!-- Left leaf -->
    <path d="M-10,-10 C-45,-45 -65,-30 -50,5 C-30,5 -15,0 -10,-10 Z" fill="#15803d"/>
    <path d="M-50,-20 L-20, -2" stroke="#84cc16" stroke-width="3"/>
    <!-- Right leaf -->
    <path d="M10,-10 C45,-45 65,-30 50,5 C30,5 15,0 10,-10 Z" fill="#15803d"/>
    <path d="M50,-20 L20, -2" stroke="#84cc16" stroke-width="3"/>
    <!-- Far Left leaf -->
    <path d="M-45,5 C-85,-15 -95,5 -70,25 C-50,20 -40,15 -45,5 Z" fill="#15803d"/>
    <!-- Far Right leaf -->
    <path d="M45,5 C85,-15 95,5 70,25 C50,20 40,15 45,5 Z" fill="#15803d"/>
  </g>

  <!-- Inner Foliage / Leaves Ring Bottom -->
  <g transform="translate(250, 340) scale(1, -1)">
    <!-- Center leaf -->
    <path d="M0,-55 C20,-30 20,-10 0,0 C-20,-10 -20,-30 0,-55 Z" fill="#84cc16" stroke="#15803d" stroke-width="3"/>
    <path d="M0,-55 L0,0" stroke="#15803d" stroke-width="3"/>
    <!-- Left leaf -->
    <path d="M-10,-10 C-45,-45 -65,-30 -50,5 C-30,5 -15,0 -10,-10 Z" fill="#15803d"/>
    <path d="M-50,-20 L-20, -2" stroke="#84cc16" stroke-width="3"/>
    <!-- Right leaf -->
    <path d="M10,-10 C45,-45 65,-30 50,5 C30,5 15,0 10,-10 Z" fill="#15803d"/>
    <path d="M50,-20 L20, -2" stroke="#84cc16" stroke-width="3"/>
    <!-- Far Left leaf -->
    <path d="M-45,5 C-85,-15 -95,5 -70,25 C-50,20 -40,15 -45,5 Z" fill="#15803d"/>
    <!-- Far Right leaf -->
    <path d="M45,5 C85,-15 95,5 70,25 C50,20 40,15 45,5 Z" fill="#15803d"/>
  </g>

  <!-- Central Banner -->
  <rect x="25" y="180" width="450" height="140" fill="#d9f99d" stroke="#15803d" stroke-width="12" rx="6" />
  
  <!-- Central Text -->
  <text x="250" y="275" font-family="Impact, Arial Black, sans-serif" font-weight="900" font-size="70" fill="#15803d" text-anchor="middle" letter-spacing="2">
    FRESH N LOCAL CO.
  </text>
</svg>